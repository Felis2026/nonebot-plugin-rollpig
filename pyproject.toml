[tool.poetry]
name = "nonebot_plugin_rollpig"
version = "0.7.0"  # v0.7.0 release
description = "今天是什么小猪"
authors = ["Bear_lele <lele2587342146@gmail.com>","Felis"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Felis2026/nonebot-plugin-rollpig"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
nonebot2 = ">=2.4.0"
nonebot-adapter-onebot = ">=2.4.0"
nonebot-plugin-htmlrender = ">=0.6.0"
nonebot-plugin-localstore = ">=0.7.4"
pydantic = ">=1.10.0,<3.0.0"

# 用于替代 requests
httpx = ">=0.20.0"

# 用于本周小猪的长图合成；12.2.0 修复多组图片解析漏洞，且要求 Python >=3.10。
Pillow = ">=12.2.0"

# NoneBot 会间接依赖 python-dotenv；这里显式收紧下限以避开 1.2.2 前的符号链接覆盖漏洞。
python-dotenv = ">=1.2.2,<2.0.0"

# 用于每日总结定时推送
nonebot-plugin-apscheduler = ">=0.5.0"

# AI 烤猪核心依赖
openai = ">=1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []
